ata-source-line="19" id="ent0015"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="152.002" x="458" y="221.34"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="132.002" x="468" y="244.3351">pliki (46 rekord&#243;w)</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="25" id="ent0017"><path d="M1551.61,118.99 L1551.61,359.9822 L1860.3952,359.9822 L1860.3952,128.99 L1850.3952,118.99 L1551.61,118.99" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1850.3952,118.99 L1850.3952,128.99 L1860.3952,128.99 L1850.3952,118.99" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="184.4819" x="1557.61" y="136.0569">Row-Level Security (RLS)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="1742.0919" y="136.0569">:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="199.7227" x="1557.61" y="151.1897">Polityka PostgreSQL wymusza:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1557.61" y="166.3225">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209.7583" x="1557.61" y="196.5881">CREATE POLICY tenant_isolation</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="158.4946" x="1565.8746" y="211.721">ON reconciliation_cycles</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234.8125" x="1565.8746" y="226.8538">USING (tenant_id = current_setting(</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1557.61" y="241.9866">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="185.7324" x="1557.61" y="257.1194">Administrator Prudential UK:</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="180.8994" x="1557.61" y="272.2522">&#9989; Widzi cykle Prudential UK</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="153.039" x="1557.61" y="287.385">&#10060; Nie widzi cykli Allianz</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="136.9731" x="1557.61" y="302.5178">&#10060; Nie widzi cykli AXA</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1557.61" y="317.6506">&#160;</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="281.7852" x="1557.61" y="332.7835">To jest egzekwowane przez BAZ&#280; DANYCH,</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="162.2778" x="1557.61" y="347.9163">nie tylko przez aplikacj&#281;!</text><line style="stroke:#181818;stroke-width:1;" x1="1552.61" x2="1599.8698" y1="176.9548" y2="176.9548"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="212.2656" x="1599.8698" y="180.9553">Dost&#281;p tylko do SWOICH danych</text><line style="stroke:#181818;stroke-width:1;" x1="1812.1354" x2="1859.3952" y1="176.9548" y2="176.9548"/></g><!--link pliki (46 rekord?w) to GMN16--><g class="link" data-entity-1="ent0015" data-entity-2="ent0017" data-link-type="association" data-source-line="25" id="lnk18"><path d="M540.14,221.03 C554.73,180.61 595.69,84.89 667.5,47.34 C746.57,6 1386.45,17.4 1470.5,47.34 C1513.62,62.7 1554.56,89.71 1589.85,118.72" fill="none" id="pliki (46 rekord&#243;w)-GMN16" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src ZPFDRjf058NtVefRiWYWKYaE_S5L5ux13Ie2YecIT8C6pyHCFCnOut4iksBPNH-WaTgdw2EK9-cJT2RyA6dIWhomTC-Pw--UkKvZoXCaq